<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{margin:0;width:100%;height:100%;background:#080a0e;font-family:Arial,sans-serif;overflow:hidden}.hud{position:fixed;z-index:9999;top:12px;left:12px;right:12px;display:flex;gap:8px;pointer-events:none}.pill{background:rgba(8,10,14,.88);border:1px solid #303640;border-radius:16px;padding:9px 12px;color:#fff;font-weight:800;box-shadow:0 6px 20px #0008}.danger{color:#ff5964}.coin{color:#ffd84d}.screen{position:fixed;inset:0;z-index:10000;background:radial-gradient(circle at 50% 35%,#202830,#080a0e 65%);display:flex;align-items:center;justify-content:center;color:white}.panel{width:min(88vw,420px);padding:30px;border-radius:28px;background:#10141aee;border:1px solid #333b46;text-align:center;box-shadow:0 20px 60px #000}.panel h1{font-size:38px;margin:0 0 8px}.panel p{color:#aeb6c1;line-height:1.5}.btn{border:0;border-radius:18px;padding:16px 24px;background:#ff334d;color:white;font-size:18px;font-weight:900;width:100%}.hint{margin-top:12px;font-size:12px;color:#7e8997}.leaflet-control-attribution{font-size:8px}.toast{position:fixed;z-index:10001;left:50%;bottom:28px;transform:translateX(-50%);background:#11161dcc;color:white;padding:12px 18px;border-radius:15px;opacity:0;transition:.25s}.toast.show{opacity:1}.locate{position:fixed;z-index:9999;right:16px;bottom:24px;width:54px;height:54px;border:0;border-radius:18px;background:#10161eee;color:#fff;font-size:25px;box-shadow:0 8px 24px #0009;border:1px solid #3a424e}.locate:active{transform:scale(.94)}.offline{position:fixed;z-index:9998;left:50%;top:72px;transform:translateX(-50%);background:#10161eee;color:#ffd84d;padding:8px 13px;border-radius:12px;font-size:11px;display:none}</style></head><body><div id="map"></div><button class="locate" onclick="centerOnMe()">⌾</button><div id="offline" class="offline">🌐 برای نمایش نقشه اینترنت لازم است</div><div class="hud"><div class="pill">❤️ <span id="hp">100</span></div><div class="pill danger">🧟 <span id="zcount">0</span></div><div class="pill coin">🪙 <span id="coins">0</span></div><div class="pill">🏃 <span id="dist">0</span>m</div></div><div id="start" class="screen"><div class="panel"><h1>🧟 GPS ZOMBIE</h1><p>از دست زامبی‌ها فرار کن، سکه جمع کن و خودت را به منطقه‌های امن برسان.</p><button class="btn" onclick="begin()">شروع بازی</button><div class="hint">برای بازی واقعی، Location گوشی باید روشن باشد و دسترسی موقعیت دقیق داده شود.</div></div></div><div id="toast" class="toast"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
let map,player,acc=30,started=false,coins=0,hp=100,dist=0,last={lat:0,lng:0},previous={lat:0,lng:0},zombies=[],safe=[],coinMarkers=[]; const VISIBLE=20, HIDE=24; const $=id=>document.getElementById(id);
function toast(t){let x=$("toast");x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
function begin(){ if(!window.AndroidGPS){toast('GPS bridge آماده نیست');return} $('start').style.display='none';started=true;AndroidGPS.start();toast('در حال پیدا کردن موقعیت واقعی...') }
function initMap(lat,lng){map=L.map('map',{zoomControl:false}).setView([lat,lng],17);const tiles=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap'}).addTo(map); tiles.on('tileerror',()=>{$('offline').style.display='block'}); player=L.marker([lat,lng],{icon:L.divIcon({className:'picon',html:'<div style="font-size:30px">🏃</div>',iconSize:[36,36],iconAnchor:[18,18]})}).addTo(map); map.setView([lat,lng],17); spawnWorld(lat,lng);}
function dxy(lat1,lon1,lat2,lon2){let R=6371000,a=(lat2-lat1)*Math.PI/180,b=(lon2-lon1)*Math.PI/180;let x=a*Math.cos((lat1+lat2)*Math.PI/360),y=b;return Math.sqrt(x*x+y*y)*R}
function offset(lat,lng,m,ang){let R=6371000;return [lat+(m*Math.cos(ang)/R)*180/Math.PI,lng+(m*Math.sin(ang)/(R*Math.cos(lat*Math.PI/180)))*180/Math.PI]}
function spawnWorld(lat,lng){for(let i=0;i<7;i++){let p=offset(lat,lng,120+Math.random()*260,Math.random()*Math.PI*2);let z=L.marker(p,{icon:L.divIcon({className:'zicon',html:'<div style="font-size:27px">🧟</div>',iconSize:[34,34],iconAnchor:[17,17]})}).addTo(map);zombies.push({m:z,lat:p[0],lng:p[1],speed:0.000004+Math.random()*0.000004});}for(let i=0;i<5;i++){let p=offset(lat,lng,80+Math.random()*350,Math.random()*Math.PI*2);let c=L.marker(p,{icon:L.divIcon({className:'cicon',html:'<div style="font-size:25px">🪙</div>',iconSize:[30,30],iconAnchor:[15,15]})}).addTo(map);coinMarkers.push({m:c,lat:p[0],lng:p[1]});}for(let i=0;i<2;i++){let p=offset(lat,lng,180+Math.random()*260,Math.random()*Math.PI*2);let s=L.circle(p,{radius:65,color:'#38e58c',fillColor:'#38e58c',fillOpacity:.16,weight:3}).addTo(map);safe.push({m:s,lat:p[0],lng:p[1]});}$("zcount").textContent=zombies.length}
function nearestSafe(lat,lng){let best=99999;safe.forEach(s=>best=Math.min(best,dxy(lat,lng,s.lat,s.lng)-65));return best}
function tick(){if(!started||!player)return; zombies.forEach(z=>{let dx=last.lat-z.lat,dy=last.lng-z.lng;let len=Math.sqrt(dx*dx+dy*dy)||1;let step=z.speed;z.lat+=dx/len*step;z.lng+=dy/len*step;z.m.setLatLng([z.lat,z.lng]);let dd=dxy(last.lat,last.lng,z.lat,z.lng);if(dd<32&&nearestSafe(last.lat,last.lng)>0){hp-=8;$("hp").textContent=Math.max(0,hp);if(hp<=0) gameOver('زامبی‌ها گیرت انداختن!');}});coinMarkers=coinMarkers.filter(c=>{if(dxy(last.lat,last.lng,c.lat,c.lng)<25){map.removeLayer(c.m);coins++;$("coins").textContent=coins;toast('🪙 سکه گرفتی!');return false}return true});if(coinMarkers.length<4){let p=offset(last.lat,last.lng,80+Math.random()*300,Math.random()*6.28);let c=L.marker(p,{icon:L.divIcon({className:'cicon',html:'<div style="font-size:25px">🪙</div>',iconSize:[30,30],iconAnchor:[15,15]})}).addTo(map);coinMarkers.push({m:c,lat:p[0],lng:p[1]})}safe.forEach(s=>{if(dxy(last.lat,last.lng,s.lat,s.lng)<65)toast('🟢 منطقه امن — زامبی‌ها نمی‌تونن بگیرنت!')});}
function gameOver(msg){started=false;document.querySelector('.panel').innerHTML='<h1>💀 '+msg+'</h1><p>سکه‌ها: '+coins+' 🪙</p><button class="btn" onclick="location.reload()">دوباره بازی کن</button>';$("start").style.display='flex'}
window.onNativeLocation=function(lat,lng,accuracy){if(last.lat!==0){dist+=dxy(last.lat,last.lng,lat,lng)}previous=last;last={lat,lng};acc=accuracy;if(!map)initMap(lat,lng);else player.setLatLng([lat,lng]);$('dist').textContent=Math.round(dist);if(accuracy>100)toast('دقت GPS پایین است؛ بیرون برو تا بهتر شود')};function centerOnMe(){if(!map||!player){toast('هنوز موقعیتت پیدا نشده');return}map.setView([last.lat,last.lng],18,{animate:true});player.openPopup()} window.gpsStatus=function(s){if(s==='location_off'){toast('Location خاموش است؛ روشنش کن و دوباره شروع بزن')}if(s==='permission_denied'){toast('اجازه Location داده نشد')}};setInterval(tick,900);
</script></body></html>
